# Security Controls Matrix
# Maps technical controls to NIST CSF 2.0 and ISO 27001:2022

control_matrix:
  - id: CT-001
    name: Alert Ingestion Validation
    description: Schema validation and sanitization of all incoming alerts
    nist_csf: DE.CM-1, DE.AE-1
    iso_27001: A.8.15, A.8.16
    zero_trust: Never trust, always verify
    automation_level: full

  - id: CT-002
    name: Risk Scoring Engine
    description: Composite risk scoring with severity, criticality, and threat context
    nist_csf: ID.RA-1, ID.RA-2, DE.AE-2
    iso_27001: A.5.7, A.8.8
    zero_trust: Least privilege access
    automation_level: full

  - id: CT-003
    name: Automated Playbook Execution
    description: Playbook-driven automated containment, eradication, recovery
    nist_csf: RS.MA-1, RS.MA-2, RC.RP-1
    iso_27001: A.5.24, A.5.26, A.8.16
    zero_trust: Assume breach
    automation_level: conditional

  - id: CT-004
    name: Audit Logging
    description: Immutable audit trail for all platform actions
    nist_csf: DE.AE-3, RS.AN-3
    iso_27001: A.8.15, A.8.17
    zero_trust: Continuous monitoring
    automation_level: full

  - id: CT-005
    name: Input Sanitization
    description: Prevention of injection, XSS, and path traversal in alert data
    nist_csf: PR.AC-1, PR.DS-1
    iso_27001: A.8.25, A.8.26
    zero_trust: Never trust, always verify
    automation_level: full

  - id: CT-006
    name: RBAC and Authorization
    description: Role-based access control for all platform operations
    nist_csf: PR.AC-1, PR.AC-4
    iso_27001: A.5.15, A.5.16, A.5.18
    zero_trust: Least privilege
    automation_level: full

  - id: CT-007
    name: Data Classification
    description: Classification of assets and alerts by criticality
    nist_csf: ID.AM-1, ID.AM-5
    iso_27001: A.5.9, A.5.10, A.5.13
    zero_trust: Explicit authorization
    automation_level: semi

  - id: CT-008
    name: Incident Response Playbooks
    description: Defined, tested, and versioned IR playbooks
    nist_csf: RS.RP-1, RS.CO-1
    iso_27001: A.5.24, A.5.25, A.5.26
    zero_trust: Assume breach
    automation_level: conditional

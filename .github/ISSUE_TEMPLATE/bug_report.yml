name: Bug Report
description: Report a bug or unexpected behavior
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Run '...'
        2. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Python version, OS, relevant config
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (platform down)
        - High (feature broken)
        - Medium (workaround exists)
        - Low (cosmetic)
